server.port=8005

spring.application.name=GATEWAY-SERVICE

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost

resilience4j.circuitbreaker.instances.alunoCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.alunoCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.alunoCB.waitDurationInOpenState=5000
resilience4j.circuitbreaker.instances.alunoCB.permittedNumberOfCallsInHalfOpenState=3
resilience4j.timelimiter.instances.alunoCB.timeoutDuration=10s

resilience4j.circuitbreaker.instances.planoCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.planoCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.planoCB.waitDurationInOpenState=5000
resilience4j.circuitbreaker.instances.planoCB.permittedNumberOfCallsInHalfOpenState=3
resilience4j.timelimiter.instances.planoCB.timeoutDuration=10s
